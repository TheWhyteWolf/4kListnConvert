[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidlib"
version = "0.1.0"
description = "Video library scanner and 4K -> 1080p conversion manager"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.scripts]
vidlib = "vidlib.cli:main"

[tool.setuptools.packages.find]
include = ["vidlib*"]

[tool.setuptools.package-data]
"vidlib.tui" = ["*.tcss"]
