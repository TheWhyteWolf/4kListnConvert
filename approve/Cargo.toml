[package]
name = "vidlib-approve"
version = "0.1.0"
edition = "2024"
description = "Fast terminal approval queue for vidlib's --bloated conversion candidates"
license = "GPL-3.0-or-later"

[[bin]]
name = "vidlib-approve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
